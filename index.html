<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>Velocity Racing - Garage</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#07090d;
    color:white;
    overflow:hidden;
}

/* TOP BAR */

.top{
    height:70px;
    background:#090b10;
    border-bottom:1px solid #252a33;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 30px;
}

.logo{
    font-size:25px;
    font-weight:900;
    letter-spacing:2px;
}

.logo span{
    color:#19aaff;
}

.nav{
    display:flex;
    gap:30px;
    color:#9da5b3;
    font-weight:bold;
}

.nav .active{
    color:white;
    border-bottom:3px solid #12aaff;
    padding-bottom:20px;
}

.money{
    color:#ffd32a;
    font-weight:bold;
}

/* MAIN */

.main{
    height:calc(100vh - 70px);
    display:flex;
}

/* LEFT MENU */

.left{
    width:190px;
    background:#0b0e14;
    padding:20px 12px;
}

.category{
    padding:15px;
    margin-bottom:8px;
    border-radius:8px;
    color:#aab1bd;
    cursor:pointer;
}

.category.active{
    background:#078cff;
    color:white;
    box-shadow:0 0 20px rgba(0,150,255,.3);
}

/* GARAGE */

.garage{
    flex:1;
    position:relative;
    padding:25px;
    overflow:hidden;
}

/* CAR AREA */

.carArea{
    height:56%;
    position:relative;
    border-radius:18px;
    overflow:hidden;

    background:
    radial-gradient(
        circle at 50% 70%,
        #27313d,
        #11151c 45%,
        #07090d 80%
    );
}

.carLight{
    position:absolute;
    width:70%;
    height:130px;
    left:15%;
    bottom:30px;

    background:
    radial-gradient(
        ellipse,
        rgba(0,174,255,.25),
        transparent 65%
    );

    filter:blur(15px);
}

/* SPORTS CAR */

.car{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-42%);
    width:min(650px,75%);
    aspect-ratio:2/1;

    cursor:pointer;
}

/* car shadow */

.car::after{
    content:"";
    position:absolute;
    width:90%;
    height:18%;
    left:5%;
    bottom:8%;
    background:#000;
    filter:blur(14px);
    border-radius:50%;
}

/* BODY */

.body{
    position:absolute;
    width:90%;
    height:45%;
    left:5%;
    bottom:24%;

    background:
    linear-gradient(
        160deg,
        #dce7ff 0%,
        #3f6dff 22%,
        #101d52 55%,
        #060913 100%
    );

    border-radius:
    48% 55% 20% 20% /
    75% 75% 30% 30%;

    box-shadow:
    inset 0 7px 15px rgba(255,255,255,.35),
    0 10px 35px rgba(0,0,0,.8);
}

/* front nose */

.nose{
    position:absolute;
    width:30%;
    height:25%;
    left:35%;
    bottom:18%;

    background:#080b12;

    clip-path:
    polygon(15% 0,85% 0,100% 100%,0 100%);
}

/* CABIN */

.cabin{
    position:absolute;
    width:43%;
    height:30%;
    left:29%;
    top:22%;

    background:
    linear-gradient(
        130deg,
        #86a6c8,
        #07101e 35%,
        #02050a
    );

    clip-path:
    polygon(15% 100%,25% 5%,75% 5%,88% 100%);
    
    border:2px solid #30455f;
}

/* WINDOWS */

.window{
    position:absolute;
    width:35%;
    height:20%;
    left:32.5%;
    top:27%;

    background:
    linear-gradient(
        135deg,
        rgba(160,220,255,.5),
        rgba(0,0,0,.9)
    );

    clip-path:
    polygon(18% 100%,25% 0,75% 0,84% 100%);
}

/* WHEELS */

.wheel{
    position:absolute;
    width:16%;
    aspect-ratio:1;
    bottom:16%;

    background:
    radial-gradient(
        circle,
        #777 0 12%,
        #151515 13% 32%,
        #aaa 33% 38%,
        #080808 39% 100%
    );

    border-radius:50%;
    border:5px solid #050505;
    box-shadow:0 5px 15px #000;
}

.w1{left:13%}
.w2{right:13%}

/* lights */

.headlight{
    position:absolute;
    width:11%;
    height:7%;
    bottom:43%;
    background:#eaffff;
    box-shadow:
    0 0 18px #aef6ff,
    0 0 35px #159dff;
    border-radius:50%;
}

.hl1{left:15%}
.hl2{right:15%}

/* INFO */

.carInfo{
    position:absolute;
    top:20px;
    left:25px;
}

.carName{
    font-size:35px;
    font-weight:900;
}

.carType{
    color:#9ba6b5;
    margin-top:5px;
}

.stats{
    position:absolute;
    right:25px;
    top:25px;
    width:230px;
}

.stat{
    margin-bottom:13px;
}

.statTitle{
    display:flex;
    justify-content:space-between;
    margin-bottom:5px;
    font-size:13px;
}

.bar{
    height:6px;
    background:#252b34;
    border-radius:10px;
    overflow:hidden;
}

.fill{
    height:100%;
    background:#14aaff;
}

/* SELECT */

.select{
    position:absolute;
    right:25px;
    bottom:25px;

    border:0;
    padding:15px 50px;

    background:#ffc928;
    color:#080808;

    font-size:17px;
    font-weight:900;

    border-radius:8px;
    cursor:pointer;
}

/* CAR LIST */

.cars{
    height:22%;
    display:flex;
    gap:12px;
    padding-top:15px;
    overflow-x:auto;
}

.carCard{
    min-width:145px;
    background:#11151d;
    border:1px solid #252c37;
    border-radius:9px;
    padding:8px;
    cursor:pointer;
}

.carCard.selected{
    border:2px solid #ffc928;
    box-shadow:0 0 18px rgba(255,201,40,.2);
}

.carMini{
    height:70px;
    border-radius:6px;

    background:
    linear-gradient(
        145deg,
        #222,
        #526bff,
        #05070b
    );

    position:relative;
}

.carMini.red{
    background:
    linear-gradient(
        145deg,
        #310808,
        #e11c2d,
        #050505
    );
}

.carMini.white{
    background:
    linear-gradient(
        145deg,
        #fff,
        #8793a5,
        #111
    );
}

.carMini.yellow{
    background:
    linear-gradient(
        145deg,
        #fff1a1,
        #e5a900,
        #161000
    );
}

.carMini.green{
    background:
    linear-gradient(
        145deg,
        #9cffc0,
        #08753c,
        #030d08
    );
}

.carCard p{
    font-size:12px;
    margin-top:7px;
    font-weight:bold;
}

/* BOTTOM */

.bottom{
    position:absolute;
    bottom:15px;
    left:25px;
    right:25px;
    height:55px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.controls{
    display:flex;
    gap:10px;
}

.control{
    background:#10151d;
    border:1px solid #29313d;
    color:#cbd3df;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
}

.control.selected{
    border-color:#00aaff;
    color:white;
    box-shadow:0 0 15px rgba(0,170,255,.25);
}

.start{
    border:0;
    background:#15a8ff;
    color:white;
    padding:14px 45px;
    border-radius:8px;
    font-weight:900;
    font-size:16px;
    cursor:pointer;
}

/* MOBILE */

@media(max-width:800px){

    .top{
        height:55px;
        padding:0 12px;
    }

    .nav{
        display:none;
    }

    .left{
        display:none;
    }

    .main{
        height:calc(100vh - 55px);
    }

    .garage{
        padding:10px;
    }

    .carArea{
        height:57%;
    }

    .carName{
        font-size:24px;
    }

    .stats{
        width:145px;
        top:15px;
        right:15px;
    }

    .select{
        right:15px;
        bottom:15px;
        padding:11px 25px;
    }

    .bottom{
        left:10px;
        right:10px;
        bottom:8px;
    }

    .control{
        padding:10px;
        font-size:11px;
    }

    .start{
        padding:11px 20px;
    }

}
</style>
</head>

<body>

<header class="top">

    <div class="logo">
        VELOCITY <span>RACING</span>
    </div>

    <div class="nav">
        <div class="active">GARAGE</div>
        <div>RACE</div>
        <div>SETTINGS</div>
    </div>

    <div class="money">
        💰 1,000,000
    </div>

</header>


<main class="main">

    <aside class="left">

        <div class="category active">🚘 ALL CARS</div>
        <div class="category">🏎 SPORTS</div>
        <div class="category">⚡ SUPERCAR</div>
        <div class="category">🏁 GT</div>
        <div class="category">🔥 MUSCLE</div>
        <div class="category">🚙 SUV</div>

    </aside>


    <section class="garage">

        <div class="carArea">

            <div class="carInfo">

                <div class="carName" id="name">
                    VORSTEN VX-3
                </div>

                <div class="carType">
                    2026 • SUPERCAR
                </div>

            </div>


            <div class="stats">

                <div class="stat">
                    <div class="statTitle">
                        <span>TOP SPEED</span>
                        <span>325 KM/H</span>
                    </div>
                    <div class="bar">
                        <div class="fill" style="width:94%"></div>
                    </div>
                </div>

                <div class="stat">
                    <div class="statTitle">
                        <span>ACCELERATION</span>
                        <span>2.8 S</span>
                    </div>
                    <div class="bar">
                        <div class="fill" style="width:91%"></div>
                    </div>
                </div>

                <div class="stat">
                    <div class="statTitle">
                        <span>HANDLING</span>
                        <span>92%</span>
                    </div>
                    <div class="bar">
                        <div class="fill" style="width:92%"></div>
                    </div>
                </div>

                <div class="stat">
                    <div class="statTitle">
                        <span>BRAKING</span>
                        <span>90%</span>
                    </div>
                    <div class="bar">
                        <div class="fill" style="width:90%"></div>
                    </div>
                </div>

            </div>


            <div class="car">

                <div class="body"></div>

                <div class="cabin"></div>

                <div class="window"></div>

                <div class="nose"></div>

                <div class="wheel w1"></div>
                <div class="wheel w2"></div>

                <div class="headlight hl1"></div>
                <div class="headlight hl2"></div>

                <div class="carLight"></div>

            </div>


            <button class="select">
                SELECT ✓
            </button>

        </div>


        <div class="cars">

            <div class="carCard selected"
                 onclick="selectCar('VORSTEN VX-3')">

                <div class="carMini"></div>
                <p>VORSTEN VX-3</p>

            </div>


            <div class="carCard"
                 onclick="selectCar('ZENRO ZR-1')">

                <div class="carMini white"></div>
                <p>ZENRO ZR-1</p>

            </div>


            <div class="carCard"
                 onclick="selectCar('FERRATTI F8')">

                <div class="carMini red"></div>
                <p>FERRATTI F8</p>

            </div>


            <div class="carCard"
                 onclick="selectCar('BAVARON M4')">

                <div class="carMini"></div>
                <p>BAVARON M4</p>

            </div>


            <div class="carCard"
                 onclick="selectCar('NISMO R35')">

                <div class="carMini green"></div>
                <p>NISMO R35</p>

            </div>


            <div class="carCard"
                 onclick="selectCar('McRAY 720S')">

                <div class="carMini yellow"></div>
                <p>McRAY 720S</p>

            </div>

        </div>


        <div class="bottom">

            <div class="controls">

                <button
                class="control selected"
                onclick="control(this)">
                    🎮 STEERING WHEEL
                </button>

                <button
                class="control"
                onclick="control(this)">
                    ⬆️ ARROWS
                </button>

            </div>


            <button
            class="start"
            onclick="startRace()">
                START RACE ▶
            </button>

        </div>

    </section>

</main>


<script>

function selectCar(name){

    document.getElementById("name")
        .textContent=name;

    document.querySelectorAll(".carCard")
        .forEach(c=>c.classList.remove("selected"));

    event.currentTarget
        .classList.add("selected");
}


function control(button){

    document.querySelectorAll(".control")
        .forEach(b=>b.classList.remove("selected"));

    button.classList.add("selected");
}


function startRace(){

    alert(
      "RACE READY!\n\nSelected car: "+
      document.getElementById("name").textContent+
      "\n\nNext page: 3D Race Track"
    );

    // Later we connect this to race.html
}

</script>

</body>
</html>
