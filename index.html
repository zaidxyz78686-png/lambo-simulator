<body>

<div id="loading">
    <h1>LAMBO <span>SIMULATOR</span></h1>
    <p>Loading 3D world...</p>
</div>

<div id="gameUI">

    <div id="title">
        LAMBO <span>SIMULATOR</span>
    </div>

    <div id="help">
        W / ↑ = Accelerate<br>
        S / ↓ = Brake<br>
        A / ← = Left<br>
        D / → = Right<br>
        R = Reset
    </div>

    <div id="speedBox">
        <div id="speed">0</div>
        <div id="kmh">KM/H</div>
        <div id="gear">GEAR N</div>
    </div>

    <div id="buttons">
        <button class="gameButton" onclick="resetCar()">RESET</button>
        <button class="gameButton" onclick="toggleCamera()">CAMERA</button>
        <button class="gameButton" onclick="fullScreen()">FULLSCREEN</button>
    </div>

    <div id="touchControls">
        <button class="touch" id="left">◀</button>
        <button class="touch" id="right">▶</button>
        <button class="touch" id="brake">▼</button>
        <button class="touch" id="gas">▲</button>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

let scene;
let camera;
let renderer;
let car;

let wheels=[];
let buildings=[];
let trees=[];

let speed=0;
let steering=0;
let cameraMode=0;

let acceleration=false;
let braking=false;
let leftPressed=false;
let rightPressed=false;

let startPosition=new THREE.Vector3(0,0,0);

const clock=new THREE.Clock();

init();

function init(){

    scene=new THREE.Scene();

    scene.background=new THREE.Color(0x87ceeb);

    scene.fog=new THREE.Fog(0x87ceeb,80,450);

    camera=new THREE.PerspectiveCamera(
        65,
        window.innerWidth/window.innerHeight,
        .1,
        1000
    );

    camera.position.set(0,5,10);

    renderer=new THREE.WebGLRenderer({
        antialias:true
    });

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio,2)
    );

    renderer.shadowMap.enabled=true;
    renderer.shadowMap.type=THREE.PCFSoftShadowMap;

    document.body.appendChild(renderer.domElement);

    createLights();
    createWorld();
    createCar();

    setupKeyboard();
    setupTouch();

    window.addEventListener(
        "resize",
        onResize
    );

    document.getElementById("loading").style.display="none";
    document.getElementById("gameUI").style.display="block";

    animate();
}


/* LIGHTING */

function createLights(){

    const ambient=new THREE.HemisphereLight(
        0xffffff,
        0x445566,
        1.8
    );

    scene.add(ambient);

    const sun=new THREE.DirectionalLight(
        0xffffff,
        2.5
    );

    sun.position.set(
        100,
        150,
        80
    );

    sun.castShadow=true;

    sun.shadow.mapSize.width=2048;
    sun.shadow.mapSize.height=2048;

    sun.shadow.camera.left=-200;
    sun.shadow.camera.right=200;
    sun.shadow.camera.top=200;
    sun.shadow.camera.bottom=-200;

    scene.add(sun);
}


/* WORLD */

function createWorld(){

    /* GRASS */

    const grassGeometry=
        new THREE.PlaneGeometry(1000,1000);

    const grassMaterial=
        new THREE.MeshStandardMaterial({
            color:0x356b32
        });

    const grass=
        new THREE.Mesh(
            grassGeometry,
            grassMaterial
        );

    grass.rotation.x=-Math.PI/2;
    grass.receiveShadow=true;

    scene.add(grass);


    /* ROAD */

    const roadGeometry=
        new THREE.PlaneGeometry(24,1000);

    const roadMaterial=
        new THREE.MeshStandardMaterial({
            color:0x303030
        });

    const road=
        new THREE.Mesh(
            roadGeometry,
            roadMaterial
        );

    road.rotation.x=-Math.PI/2;
    road.position.y=.02;

    road.receiveShadow=true;

    scene.add(road);


    /* ROAD EDGES */

    createRoadLine(-11.2);
    createRoadLine(11.2);


    /* CENTER LINES */

    for(let z=-480;z<500;z+=18){

        const lineGeometry=
            new THREE.BoxGeometry(
                .35,
                .03,
                8
            );

        const lineMaterial=
            new THREE.MeshStandardMaterial({
                color:0xffffff
            });

        const line=
            new THREE.Mesh(
                lineGeometry,
                lineMaterial
            );

        line.position.set(
            0,
            .06,
            z
        );

        scene.add(line);
    }


    /* BUILDINGS */

    for(let z=-450;z<450;z+=35){

        createBuilding(
            -28,
            z,
            8+Math.random()*8,
            12+Math.random()*20
        );

        createBuilding(
            28,
            z+15,
            8+Math.random()*8,
            12+Math.random()*20
        );
    }


    /* TREES */

    for(let z=-440;z<440;z+=22){

        createTree(
            -17,
            z+Math.random()*8
        );

        createTree(
            17,
            z+Math.random()*8
        );
    }


    /* STREET LIGHTS */

    for(let z=-450;z<450;z+=35){

        createStreetLight(-13,z);
        createStreetLight(13,z+15);
    }
}


function createRoadLine(x){

    const geometry=
        new THREE.BoxGeometry(
            .25,
            .04,
            1000
        );

    const material=
        new THREE.MeshStandardMaterial({
            color:0xf4d35e
        });

    const line=
        new THREE.Mesh(
            geometry,
            material
        );

    line.position.set(
        x,
        .05,
        0
    );

    scene.add(line);
}


function createBuilding(x,z,width,height){

    const geometry=
        new THREE.BoxGeometry(
            width,
            height,
            14
        );

    const material=
        new THREE.MeshStandardMaterial({
            color:
                new THREE.Color(
                    0.25+
                    Math.random()*.25,
                    0.25+
                    Math.random()*.25,
                    0.28+
                    Math.random()*.25
                )
        });

    const building=
        new THREE.Mesh(
            geometry,
            material
        );

    building.position.set(
        x,
        height/2,
        z
    );

    building.castShadow=true;
    building.receiveShadow=true;

    scene.add(building);

    buildings.push(building);
}


function createTree(x,z){

    const group=
        new THREE.Group();

    const trunkGeometry=
        new THREE.CylinderGeometry(
            .35,
            .5,
            3,
            8
        );

    const trunkMaterial=
        new THREE.MeshStandardMaterial({
            color:0x5b3924
        });

    const trunk=
        new THREE.Mesh(
            trunkGeometry,
            trunkMaterial
        );

    trunk.position.y=1.5;

    trunk.castShadow=true;

    group.add(trunk);


    const leafGeometry=
        new THREE.SphereGeometry(
            2.1,
            10,
            8
        );

    const leafMaterial=
        new THREE.MeshStandardMaterial({
            color:0x1c6b31
        });

    const leaves=
        new THREE.Mesh(
            leafGeometry,
            leafMaterial
        );

    leaves.position.y=4;

    leaves.castShadow=true;

    group.add(leaves);

    group.position.set(
        x,
        0,
        z
    );

    scene.add(group);

    trees.push(group);
}


function createStreetLight(x,z){

    const poleGeometry=
        new THREE.CylinderGeometry(
            .08,
            .08,
            7,
            8
        );

    const poleMaterial=
        new THREE.MeshStandardMaterial({
            color:0x333333
        });

    const pole=
        new THREE.Mesh(
            poleGeometry,
            poleMaterial
        );

    pole.position.set(
        x,
        3.5,
        z
    );

    scene.add(pole);


    const lampGeometry=
        new THREE.SphereGeometry(
            .3,
            8,
            8
        );

    const lampMaterial=
        new THREE.MeshStandardMaterial({
            color:0xffffff,
            emissive:0xffffcc,
            emissiveIntensity:2
        });

    const lamp=
        new THREE.Mesh(
            lampGeometry,
            lampMaterial
        );

    lamp.position.set(
        x,
        7,
        z
    );

    scene.add(lamp);
}


/* CAR */

function createCar(){

    car=new THREE.Group();

    /* BODY */

    const bodyGeometry=
        new THREE.BoxGeometry(
            2.4,
            .55,
            4.7
        );

    const bodyMaterial=
        new THREE.MeshStandardMaterial({
            color:0xc9a900,
            metalness:.75,
            roughness:.2
        });

    const body=
        new THREE.Mesh(
            bodyGeometry,
            bodyMaterial
        );

    body.position.y=.75;
    body.castShadow=true;

    car.add(body);


    /* LOWER BODY */

    const lowerGeometry=
        new THREE.BoxGeometry(
            2.55,
            .35,
            3.9
        );

    const lower=
        new THREE.Mesh(
            lowerGeometry,
            bodyMaterial
        );

    lower.position.y=.52;

    lower.castShadow=true;

    car.add(lower);


    /* CABIN */

    const cabinGeometry=
        new THREE.BoxGeometry(
            1.75,
            .65,
            2
        );

    const cabinMaterial=
        new THREE.MeshStandardMaterial({
            color:0x11151b,
            metalness:.3,
            roughness:.1
        });

    const cabin=
        new THREE.Mesh(
            cabinGeometry,
            cabinMaterial
        );

    cabin.position.set(
        0,
        1.25,
        -.15
    );

    cabin.castShadow=true;

    car.add(cabin);


    /* WINDSCREEN */

    const glassGeometry=
        new THREE.BoxGeometry(
            1.55,
            .38,
            .08
        );

    const glassMaterial=
        new THREE.MeshStandardMaterial({
            color:0x152f3d,
            transparent:true,
            opacity:.75,
            metalness:.4,
            roughness:.05
        });

    const windshield=
        new THREE.Mesh(
            glassGeometry,
            glassMaterial
        );

    windshield.position.set(
        0,
        1.28,
        .92
    );

    windshield.rotation.x=-.2;

    car.add(windshield);


    /* WHEELS */

    const wheelPositions=[
        [-1.18,.48,1.45],
        [1.18,.48,1.45],
        [-1.18,.48,-1.45],
        [1.18,.48,-1.45]
    ];

    wheelPositions.forEach(pos=>{

        const wheelGeometry=
            new THREE.CylinderGeometry(
                .48,
                .48,
                .3,
                20
            );

        const wheelMaterial=
            new THREE.MeshStandardMaterial({
                color:0x111111,
                roughness:.85
            });

        const wheel=
            new THREE.Mesh(
                wheelGeometry,
                wheelMaterial
            );

        wheel.rotation.z=Math.PI/2;

        wheel.position.set(
            pos[0],
            pos[1],
            pos[2]
        );

        wheel.castShadow=true;

        car.add(wheel);

        wheels.push(wheel);
    });


    /* HEADLIGHTS */

    createLight(-.75,1.0,2.38);
    createLight(.75,1.0,2.38);


    /* TAIL LIGHTS */

    createTailLight(-.75,.95,-2.38);
    createTailLight(.75,.95,-2.38);


    car.position.copy(startPosition);

    scene.add(car);
}


function createLight(x,y,z){

    const geometry=
        new THREE.BoxGeometry(
            .45,
            .18,
            .08
        );

    const material=
        new THREE.MeshStandardMaterial({
            color:0xffffff,
            emissive:0xffffff,
            emissiveIntensity:3
        });

    const light=
        new THREE.Mesh(
            geometry,
            material
        );

    light.position.set(
        x,y,z
    );

    car.add(light);
}


function createTailLight(x,y,z){

    const geometry=
        new THREE.BoxGeometry(
            .45,
            .15,
            .08
        );

    const material=
        new THREE.MeshStandardMaterial({
            color:0xff1111,
            emissive:0xff0000,
            emissiveIntensity:2
        });

    const light=
        new THREE.Mesh(
            geometry,
            material
        );

    light.position.set(
        x,y,z
    );

    car.add(light);
}


/* CONTROLS */

function setupKeyboard(){

    window.addEventListener(
        "keydown",
        e=>{

            if(
                e.key==="w" ||
                e.key==="W" ||
                e.key==="ArrowUp"
            )
                acceleration=true;

            if(
                e.key==="s" ||
                e.key==="S" ||
                e.key==="ArrowDown"
            )
                braking=true;

            if(
                e.key==="a" ||
                e.key==="A" ||
                e.key==="ArrowLeft"
            )
                leftPressed=true;

            if(
                e.key==="d" ||
                e.key==="D" ||
                e.key==="ArrowRight"
            )
                rightPressed=true;

            if(
                e.key==="r" ||
                e.key==="R"
            )
                resetCar();
        }
    );


    window.addEventListener(
        "keyup",
        e=>{

            if(
                e.key==="w" ||
                e.key==="W" ||
                e.key==="ArrowUp"
            )
                acceleration=false;

            if(
                e.key==="s" ||
                e.key==="S" ||
                e.key==="ArrowDown"
            )
                braking=false;

            if(
                e.key==="a" ||
                e.key==="A" ||
                e.key==="ArrowLeft"
            )
                leftPressed=false;

            if(
                e.key==="d" ||
                e.key==="D" ||
                e.key==="ArrowRight"
            )
                rightPressed=false;
        }
    );
}


function setupTouch(){

    bindTouch(
        "gas",
        ()=>acceleration=true,
        ()=>acceleration=false
    );

    bindTouch(
        "brake",
        ()=>braking=true,
        ()=>braking=false
    );

    bindTouch(
        "left",
        ()=>leftPressed=true,
        ()=>leftPressed=false
    );

    bindTouch(
        "right",
        ()=>rightPressed=true,
        ()=>rightPressed=false
    );
}


function bindTouch(id,down,up){

    const element=
        document.getElementById(id);

    element.addEventListener(
        "touchstart",
        e=>{
            e.preventDefault();
            down();
        }
    );

    element.addEventListener(
        "touchend",
        e=>{
            e.preventDefault();
            up();
        }
    );

    element.addEventListener(
        "mousedown",
        down
    );

    element.addEventListener(
        "mouseup",
        up
    );

    element.addEventListener(
        "mouseleave",
        up
    );
}


/* GAME PHYSICS */

function updateCar(delta){

    if(acceleration){

        speed+=100*delta;

    }else{

        speed-=25*delta;
    }


    if(braking){

        speed-=150*delta;
    }


    speed=
        THREE.MathUtils.clamp(
            speed,
            0,
            260
        );


    let steeringTarget=0;

    if(leftPressed)
        steeringTarget=1;

    if(rightPressed)
        steeringTarget=-1;


    steering=
        THREE.MathUtils.lerp(
            steering,
            steeringTarget,
            delta*7
        );


    const speedFactor=
        speed/260;


    car.rotation.y+=
        steering*
        speedFactor*
        delta*
        1.8;


    const direction=
        new THREE.Vector3(
            Math.sin(car.rotation.y),
            0,
            Math.cos(car.rotation.y)
        );


    car.position.addScaledVector(
        direction,
        -speedFactor*35*delta
    );


    /* wheel rotation */

    wheels.forEach(w=>{
        w.rotation.x-=
            speedFactor*15*delta;
    });


    /* keep car inside world */

    car.position.x=
        THREE.MathUtils.clamp(
            car.position.x,
            -10,
            10
        );


    updateUI();
}


function updateUI(){

    document.getElementById(
        "speed"
    ).innerText=
        Math.round(speed);


    let gear="N";

    if(speed>5) gear="1";
    if(speed>45) gear="2";
    if(speed>85) gear="3";
    if(speed>130) gear="4";
    if(speed>180) gear="5";
    if(speed>225) gear="6";

    document.getElementById(
        "gear"
    ).innerText=
        "GEAR "+gear;
}


/* CAMERA */

function updateCamera(){

    let target;

    if(cameraMode===0){

        target=new THREE.Vector3(
            car.position.x,
            car.position.y+4,
            car.position.z+9
        );

        camera.position.lerp(
            target,
            .08
        );

    }else{

        target=new THREE.Vector3(
            car.position.x,
            car.position.y+1.5,
            car.position.z+3
        );

        camera.position.lerp(
            target,
            .12
        );
    }


    const lookTarget=
        new THREE.Vector3(
            car.position.x,
            car.position.y+1,
            car.position.z-5
        );

    camera.lookAt(
        lookTarget
    );
}


function toggleCamera(){

    cameraMode=
        cameraMode===0 ? 1 : 0;
}


function resetCar(){

    speed=0;
    steering=0;

    car.position.set(
        0,
        0,
        0
    );

    car.rotation.set(
        0,
        0,
        0
    );
}


function fullScreen(){

    if(!document.fullscreenElement){

        document.documentElement.requestFullscreen();

    }else{

        document.exitFullscreen();
    }
}


/* LOOP */

function animate(){

    requestAnimationFrame(
        animate
    );

    const delta=
        Math.min(
            clock.getDelta(),
            .05
        );

    updateCar(delta);
    updateCamera();

    renderer.render(
        scene,
        camera
    );
}


function onResize(){

    camera.aspect=
        window.innerWidth/
        window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
}

</script>

</body>
</html>
